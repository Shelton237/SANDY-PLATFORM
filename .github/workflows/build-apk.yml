name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'twa/**'

jobs:
  build-apk:
    name: Build Sandy Juice APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─── Android SDK ─────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install build tools
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ─── Gradle wrapper ──────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Gradle wrapper in twa/
        run: |
          cd twa
          gradle wrapper --gradle-version=8.6 --distribution-type=bin
          chmod +x gradlew

      # ─── Download icons from production server ────────────────────────────────
      - name: Download PWA icons from server
        run: |
          BASE="https://sandyjuice.cm/pwa-icons"

          # Ensure mipmap dirs exist (git doesn't track empty dirs)
          mkdir -p twa/app/src/main/res/mipmap-mdpi
          mkdir -p twa/app/src/main/res/mipmap-hdpi
          mkdir -p twa/app/src/main/res/mipmap-xhdpi
          mkdir -p twa/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi

          # Download directly at matching sizes — no ImageMagick needed
          curl -fsSL --retry 3 "$BASE/icon-72x72.png"   -o twa/app/src/main/res/mipmap-mdpi/ic_launcher.png
          curl -fsSL --retry 3 "$BASE/icon-72x72.png"   -o twa/app/src/main/res/mipmap-hdpi/ic_launcher.png
          curl -fsSL --retry 3 "$BASE/icon-96x96.png"   -o twa/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          curl -fsSL --retry 3 "$BASE/icon-144x144.png" -o twa/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          curl -fsSL --retry 3 "$BASE/icon-192x192.png" -o twa/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Icons ready:"
          ls -lh twa/app/src/main/res/mipmap-*/ic_launcher.png

      # ─── Generate signing keystore ───────────────────────────────────────────
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore twa/app/sandyjuice.keystore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias sandyjuice \
            -dname "CN=Sandy Juice, OU=App, O=SandyJuice, L=Yaounde, ST=Centre, C=CM" \
            -storepass sandyjuice2024 \
            -keypass sandyjuice2024

          # Print SHA-256 fingerprint (needed for assetlinks.json later)
          keytool -list -v \
            -keystore twa/app/sandyjuice.keystore \
            -alias sandyjuice \
            -storepass sandyjuice2024 2>/dev/null | grep "SHA256:"

      # ─── Build release APK ───────────────────────────────────────────────────
      - name: Build APK
        working-directory: twa
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PATH=sandyjuice.keystore \
            -PKEYSTORE_PASSWORD=sandyjuice2024 \
            -PKEY_ALIAS=sandyjuice \
            -PKEY_PASSWORD=sandyjuice2024 \
            --stacktrace \
            --no-daemon

      # ─── Locate and rename APK ───────────────────────────────────────────────
      - name: Locate APK
        run: |
          find twa -name "*.apk" -type f
          cp twa/app/build/outputs/apk/release/app-release.apk sandy-juice.apk || true
          ls -lh sandy-juice.apk 2>/dev/null || echo "APK not found at expected path"

      # ─── Upload APK ─────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandy-juice-v1.0.0
          path: |
            sandy-juice.apk
            twa/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # ─── Print SHA-256 for assetlinks.json ───────────────────────────────────
      - name: Print certificate SHA-256 (for assetlinks.json)
        run: |
          echo "========================================================"
          echo "  SHA-256 fingerprint for Digital Asset Links:"
          echo "========================================================"
          keytool -list -v \
            -keystore twa/app/sandyjuice.keystore \
            -alias sandyjuice \
            -storepass sandyjuice2024 2>/dev/null | grep "SHA256:"
          echo "========================================================"
          echo "  Add this to: https://sandyjuice.cm/.well-known/assetlinks.json"
          echo "========================================================"
